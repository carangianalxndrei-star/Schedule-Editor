<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BSIT-MWA 1st Term Schedule</title>
<style>
  :root {
    --window-blue: #6a8fd6;
    --window-blue-dark: #3f5fa8;
    --card-blue: #5b7fc7;
    --cream: #f5f0dd;
    --outline: #1a1a2e;
    --yellow: #ffd23f;
    --text-light: #eef1fb;
    --shadow: #14172b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: radial-gradient(circle at 30% 20%, #1a1a1a 0%, #0a0a0a 65%, #000000 100%);
    font-family: "Courier New", monospace;
    padding: 24px;
  }

  .window {
    width: 100%;
    max-width: 700px;
    background: var(--window-blue);
    border: 5px solid var(--outline);
    border-bottom: 10px solid var(--window-blue-dark);
    border-radius: 14px;
    box-shadow: 0 10px 0 var(--shadow), 0 14px 24px rgba(0,0,0,0.5);
    overflow: visible;
    position: relative;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .window-inner {
    border-radius: 9px;
    overflow: hidden;
  }

  .mascot {
    position: absolute;
    left: -10px;
    bottom: -14px;
    width: 60px;
    height: auto;
    filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.35));
    pointer-events: none;
    z-index: 1;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--window-blue);
    border-bottom: 4px solid var(--outline);
  }

  .nav-btn {
    width: 26px;
    height: 26px;
    border: 3px solid var(--outline);
    border-radius: 50%;
    background: var(--window-blue-dark);
    color: var(--text-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    cursor: pointer;
    user-select: none;
  }
  .nav-btn:active { transform: translateY(1px); }

  .titlebar-label {
    flex: 1;
    background: var(--cream);
    border: 3px solid var(--outline);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--outline);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    outline: none;
  }
  .titlebar-label:focus {
    text-overflow: clip;
    overflow: auto;
  }

  .win-controls {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .win-controls span {
    width: 20px;
    height: 20px;
    border: 3px solid var(--outline);
    background: var(--cream);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    border-radius: 3px;
    cursor: pointer;
  }
  .win-controls .close { background: #ff5b5b; color: var(--outline); font-weight: bold; }
  .win-controls .close:active { transform: translateY(1px); }
  #edit-toggle.active { background: var(--yellow); }

  .window.closed {
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
  }

  .reopen-btn {
    display: none;
    background: var(--window-blue-dark);
    border: 3px dashed var(--yellow);
    color: var(--yellow);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
  }
  .reopen-btn.show {
    display: inline-block;
  }

  .body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--cream);
  }

  .day-row {
    display: flex;
    gap: 14px;
    align-items: stretch;
  }
  .day-row.reverse { flex-direction: row-reverse; }

  .day-badge {
    position: relative;
    flex: 0 0 90px;
    background: var(--window-blue-dark);
    border: 4px solid var(--outline);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
    padding: 8px;
  }
  .day-badge span {
    font-size: 20px;
    color: var(--yellow);
    text-shadow: 2px 2px 0 var(--outline);
    letter-spacing: 1px;
    outline: none;
    text-align: center;
    width: 100%;
  }

  .day-remove {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 22px;
    height: 22px;
    border: 3px solid var(--outline);
    border-radius: 50%;
    background: #ff5b5b;
    color: var(--outline);
    font-weight: bold;
    font-size: 11px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
  }
  .edit-mode .day-remove { display: flex; }

  .classes {
    flex: 1;
    background: var(--card-blue);
    border: 4px solid var(--outline);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.08);
  }

  .class-line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    font-size: 10.5px;
    color: var(--text-light);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
    line-height: 1.6;
    position: relative;
    padding-right: 18px;
  }
  .class-line .name,
  .class-line .time,
  .class-line .room {
    outline: none;
    letter-spacing: 0.5px;
  }
  .class-line .name {
    flex: 1 1 auto;
    min-width: 0;
  }
  .class-line .time,
  .class-line .room {
    color: #dfe7ff;
    white-space: nowrap;
    font-size: 10px;
    opacity: 0.9;
  }
  .class-line .time-room {
    display: flex;
    gap: 10px;
    flex: 0 0 auto;
    white-space: nowrap;
  }

  .line-remove {
    position: absolute;
    right: -4px;
    top: 0;
    width: 16px;
    height: 16px;
    border: 2px solid var(--outline);
    border-radius: 50%;
    background: #ff5b5b;
    color: var(--outline);
    font-weight: bold;
    font-size: 9px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
  }
  .edit-mode .line-remove { display: flex; }

  .add-class-btn {
    align-self: flex-start;
    margin-top: 4px;
    background: var(--window-blue-dark);
    border: 2px dashed var(--text-light);
    color: var(--text-light);
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 1px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    opacity: 0.85;
    display: none;
  }
  .edit-mode .add-class-btn { display: inline-block; }
  .add-class-btn:hover { opacity: 1; }

  .add-day-row {
    display: none;
    justify-content: center;
  }
  .edit-mode .add-day-row { display: flex; }
  .add-day-btn {
    background: var(--window-blue-dark);
    border: 3px dashed var(--yellow);
    color: var(--yellow);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
  }

  .hint {
    text-align: center;
    color: #8fa2c9;
    font-size: 9px;
    letter-spacing: 0.5px;
    padding: 4px 0 0;
    display: none;
  }
  .edit-mode .hint { display: block; }

  [contenteditable="true"]:hover {
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
  }
  [contenteditable="true"]:focus {
    background: rgba(255,255,255,0.14);
    border-radius: 3px;
  }

  @media (max-width: 560px) {
    .day-row, .day-row.reverse { flex-direction: column; }
    .day-badge { flex: 0 0 auto; padding: 10px; }
  }
</style>
</head>

<button class="reopen-btn" id="reopen-btn">↺ REOPEN SCHEDULE</button>

<script>
let schedule = [];

const container = document.getElementById('schedule-body');

function render() {
  container.innerHTML = '';

  schedule.forEach((dayData, dIdx) => {
    const row = document.createElement('div');
    row.className = 'day-row' + (dayData.reverse ? ' reverse' : '');

    const badge = document.createElement('div');
    badge.className = 'day-badge';

    const daySpan = document.createElement('span');
    daySpan.contentEditable = 'true';
    daySpan.spellcheck = false;
    daySpan.textContent = dayData.day;
    daySpan.addEventListener('input', () => dayData.day = daySpan.textContent);

    const removeDay = document.createElement('div');
    removeDay.className = 'day-remove';
    removeDay.textContent = '✕';
    removeDay.title = 'Remove day';
    removeDay.addEventListener('click', () => {
      schedule.splice(dIdx, 1);
      render();
    });

    badge.appendChild(daySpan);
    badge.appendChild(removeDay);

    const classesBox = document.createElement('div');
    classesBox.className = 'classes';

    dayData.classes.forEach((c, cIdx) => {
      const line = document.createElement('div');
      line.className = 'class-line';

      const nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.contentEditable = 'true';
      nameSpan.spellcheck = false;
      nameSpan.textContent = c.name;
      nameSpan.addEventListener('input', () => c.name = nameSpan.textContent);

      const timeRoom = document.createElement('span');
      timeRoom.className = 'time-room';

      const timeSpan = document.createElement('span');
      timeSpan.className = 'time';
      timeSpan.contentEditable = 'true';
      timeSpan.spellcheck = false;
      timeSpan.textContent = c.time;
      timeSpan.addEventListener('input', () => c.time = timeSpan.textContent);

      const roomSpan = document.createElement('span');
      roomSpan.className = 'room';
      roomSpan.contentEditable = 'true';
      roomSpan.spellcheck = false;
      roomSpan.textContent = c.room;
      roomSpan.addEventListener('input', () => c.room = roomSpan.textContent);

      timeRoom.appendChild(timeSpan);
      timeRoom.appendChild(roomSpan);

      const removeLine = document.createElement('div');
      removeLine.className = 'line-remove';
      removeLine.textContent = '✕';
      removeLine.title = 'Remove class';
      removeLine.addEventListener('click', () => {
        dayData.classes.splice(cIdx, 1);
        render();
      });

      line.appendChild(nameSpan);
      line.appendChild(timeRoom);
      line.appendChild(removeLine);
      classesBox.appendChild(line);
    });

    const addClassBtn = document.createElement('button');
    addClassBtn.className = 'add-class-btn';
    addClassBtn.textContent = '+ ADD CLASS';
    addClassBtn.addEventListener('click', () => {
      dayData.classes.push({ name: "New Subject", time: "9:00am - 10:00am", room: "Rm.000" });
      render();
    });
    classesBox.appendChild(addClassBtn);

    row.appendChild(badge);
    row.appendChild(classesBox);
    container.appendChild(row);
  });

  const addDayRow = document.createElement('div');
  addDayRow.className = 'add-day-row';
  const addDayBtn = document.createElement('button');
  addDayBtn.className = 'add-day-btn';
  addDayBtn.textContent = '+ ADD DAY';
  addDayBtn.addEventListener('click', () => {
    schedule.push({
      day: "NEW",
      reverse: schedule.length % 2 === 1,
      classes: [{ name: "New Subject", time: "9:00am - 10:00am", room: "Rm.000" }]
    });
    render();
  });
  addDayRow.appendChild(addDayBtn);
  container.appendChild(addDayRow);

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = 'Click any text to edit it directly';
  container.appendChild(hint);
}

render();

const appWindow = document.getElementById('app-window');
const closeBtn = document.getElementById('close-btn');
const reopenBtn = document.getElementById('reopen-btn');

closeBtn.addEventListener('click', () => {
  appWindow.classList.add('closed');
  reopenBtn.classList.add('show');
});

reopenBtn.addEventListener('click', () => {
  appWindow.classList.remove('closed');
  reopenBtn.classList.remove('show');
});

const editToggle = document.getElementById('edit-toggle');
editToggle.addEventListener('click', () => {
  appWindow.classList.toggle('edit-mode');
  editToggle.classList.toggle('active');
});
</script>
